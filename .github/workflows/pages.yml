name: Build and deploy the browser game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the matching Godot editor and Web template
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/godot
            work/templates
          key: godot-linux-web-${{ env.GODOT_VERSION }}-v1
      - name: Install Godot and the single-threaded Web template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/godot work/templates
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o work/godot.zip
          unzip -q work/godot.zip -d work/godot
          mv "work/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" work/godot/godot
          chmod +x work/godot/godot
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o work/templates.tpz
          unzip -p work/templates.tpz templates/web_nothreads_release.zip > work/templates/web_nothreads_release.zip
          rm work/godot.zip work/templates.tpz
      - name: Export the browser game
        run: python3 tools/build_web.py --godot "$PWD/work/godot/godot"
      - name: Check game rules and simulation isolation
        run: |
          work/godot/godot --headless --path source --script Tests.gd
          work/godot/godot --headless --path source --script TestBalanceAgent.gd
      - name: Upload the static game
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'CarterMcClellan/hex_game'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
